distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Without this the wrapper runs whatever the download gave it, and the wrapper is the first
# thing build.sh executes on a machine with a cold cache. Gradle's own published checksum for
# gradle-8.14.5-bin.zip. It belongs to THIS distributionUrl: bump the version and this line has
# to move with it, or the next cold build fails on a hash it was never given.
distributionSha256Sum=6f74b601422d6d6fc4e1f9a1ab6522f642c2fdcbc15ae33ebd30ba3d7198e854
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
