name = "jpfoodmap-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

routes = [
  { pattern = "api.jpfoodmap.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "KV"
id = "7d6e7c510aec41e6a309d060e40565a7"

[vars]
GOOGLE_CLIENT_ID = "536198170238-me7dpu2og75tseuekl3pu8rjjgo2ig2p.apps.googleusercontent.com"
ALLOWED_ORIGINS = "https://jpfoodmap.com,https://www.jpfoodmap.com,http://localhost:8000"

PLACES_UI_ENABLED = "true"
PLACES_DAILY_LIMIT = "200"
# The first 10,000 Places UI Kit Query requests a month are free, then about
# USD 1 per 1,000, so this cap bounds the overage near USD 10 a month.
PLACES_MONTHLY_LIMIT = "20000"

[[durable_objects.bindings]]
name = "PLACES_QUOTA"
class_name = "PlacesQuota"

[[migrations]]
tag = "places-quota-v1"
new_sqlite_classes = ["PlacesQuota"]
